<!DOCTYPE html>
<html lang="ms">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SPMDR Login</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">

<link href="css/style.css" rel="stylesheet">

</head>

<body class="login-page">

<div class="container">

<div class="row justify-content-center">

<div class="col-lg-4 col-md-6">

<div class="card login-card">

<div class="text-center">

<img src="img/ChatGPT Image Aug 1, 2026, 04_08_44 PM.png" class="login-logo">

<h2 class="login-title text-danger">
SPMDR
</h2>

<p class="login-subtitle">
Sistem Pengurusan Sparepart
<br>
Muto Dalang Rock
</p>

</div>

<form id="loginForm">

<div class="mb-3">

<label class="form-label">
Email
</label>

<div class="input-group">

<span class="input-group-text">
<i class="bi bi-envelope"></i>
</span>

<input
type="email"
id="email"
class="form-control"
placeholder="Masukkan Email"
required>

</div>

</div>

<div class="mb-3">

<label class="form-label">
Password
</label>

<div class="input-group">

<span class="input-group-text">
<i class="bi bi-lock"></i>
</span>

<input
type="password"
id="password"
class="form-control"
placeholder="Masukkan Password"
required>

<button
type="button"
class="btn btn-outline-secondary"
onclick="togglePassword()">

<i id="eye" class="bi bi-eye"></i>

</button>

</div>

</div>

<div class="d-grid mt-4">

<button
id="loginBtn"
type="submit"
class="btn btn-danger btn-login">

<i class="bi bi-box-arrow-in-right"></i>

Log Masuk

</button>

</div>

</form>

<div
id="message"
class="text-center mt-3 text-danger fw-semibold">

</div>

<hr>

<div class="text-center version">

Versi 1.0.0

<br>

© 2026 SPMDR System

</div>

</div>

</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/config.js"></script>

<script src="js/login.js"></script>

</body>

</html>

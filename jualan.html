<!DOCTYPE html>
<html lang="ms">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SPMDL - Jualan</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">

</head>


<body>


<div class="container-fluid">

<div class="row">


<!-- MENU -->

<div class="col-md-3 col-lg-2 bg-dark text-white min-vh-100 p-3">


<h3 class="text-danger fw-bold">
SPMDL
</h3>

<hr>


<ul class="nav flex-column">


<li>
<a class="nav-link text-white" href="dashboard.html">
🏠 Dashboard
</a>
</li>


<li>
<a class="nav-link text-white" href="produk.html">
📦 Produk
</a>
</li>


<li>
<a class="nav-link text-white" href="barang_masuk.html">
📥 Barang Masuk
</a>
</li>


<li>
<a class="nav-link text-white" href="barang_keluar.html">
📤 Barang Keluar
</a>
</li>


<li>
<a class="nav-link text-white" href="jualan.html">
🧾 Jualan
</a>
</li>


</ul>


<button onclick="logout()" class="btn btn-danger w-100 mt-4">

Logout

</button>


</div>





<!-- CONTENT -->


<div class="col-md-9 col-lg-10 p-4">


<h2>
🧾 Jualan
</h2>



<div class="card shadow p-4">


<div class="row">


<div class="col-md-4">

<label>Produk</label>

<select id="produk_id" class="form-control">

<option>
Pilih Produk
</option>

</select>

</div>



<div class="col-md-3">

<label>Kuantiti</label>

<input 
type="number"
id="kuantiti"
class="form-control"
value="1">

</div>



<div class="col-md-3">

<label>Bayaran</label>


<select id="jenis_bayaran" class="form-control">

<option value="CASH">
CASH
</option>

<option value="QR">
QR
</option>

<option value="HUTANG">
HUTANG
</option>

</select>


</div>


<div class="col-md-2 d-flex align-items-end">


<button 
onclick="tambahItem()"
class="btn btn-danger w-100">

Tambah

</button>


</div>


</div>



<hr>



<table class="table table-bordered">


<thead>

<tr>

<th>Produk</th>

<th>Qty</th>

<th>Harga</th>

<th>Jumlah</th>

</tr>


</thead>


<tbody id="cart">


</tbody>


</table>



<h4 class="text-end">

Jumlah:
RM <span id="jumlah">0</span>

</h4>



<button 
onclick="simpanJualan()"
class="btn btn-success">

Simpan Jualan

</button>


</div>



</div>


</div>


</div>





<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/config.js"></script>

<script src="js/jualan.js"></script>


</body>

</html>

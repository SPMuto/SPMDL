<!DOCTYPE html>
<html lang="ms">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SPMDL - Produk</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">

</head>


<body>


<div class="container-fluid">

<div class="row">


<!-- MENU -->

<div class="col-md-3 col-lg-2 bg-dark text-white min-vh-100 p-3">


<h3 class="text-danger fw-bold">
SPMDL
</h3>

<small>
Sistem Pengurusan Sparepart
</small>

<hr>


<ul class="nav flex-column">


<li class="nav-item">

<a class="nav-link text-white" href="dashboard.html">
🏠 Dashboard
</a>

</li>


<li class="nav-item">

<a class="nav-link text-white" href="produk.html">
📦 Produk
</a>

</li>


<li class="nav-item">

<a class="nav-link text-white" href="#">
📥 Barang Masuk
</a>

</li>


<li class="nav-item">

<a class="nav-link text-white" href="#">
📤 Barang Keluar
</a>

</li>


<li class="nav-item">

<a class="nav-link text-white" href="#">
👥 Supplier
</a>

</li>


</ul>



<button onclick="logout()" class="btn btn-danger w-100 mt-4">

Logout

</button>


</div>





<!-- CONTENT -->


<div class="col-md-9 col-lg-10 p-4">


<h2>
📦 Produk
</h2>



<button 
class="btn btn-danger mb-3"
data-bs-toggle="modal"
data-bs-target="#modalProduk">

+ Tambah Produk

</button>





<div class="card shadow">


<div class="card-body">


<div class="table-responsive">


<table class="table table-striped table-bordered">


<thead>


<tr>

<th>Kod</th>
<th>Barcode</th>
<th>Nama Produk</th>
<th>Jenama</th>
<th>Motor</th>
<th>Supplier</th>
<th>Rak</th>
<th>Stok</th>
<th>Harga</th>
<th>Status</th>
<th>Tindakan</th>

</tr>


</thead>



<tbody id="senaraiProduk">


</tbody>



</table>


</div>


</div>


</div>



</div>



</div>


</div>








<!-- MODAL TAMBAH PRODUK -->


<div class="modal fade" id="modalProduk">


<div class="modal-dialog modal-lg">


<div class="modal-content">



<div class="modal-header">


<h5 class="modal-title">

Tambah Produk

</h5>


<button 
class="btn-close"
data-bs-dismiss="modal">

</button>


</div>





<div class="modal-body">



<input 
id="kod_produk"
class="form-control mb-2"
placeholder="Kod Produk">



<input 
id="barcode"
class="form-control mb-2"
placeholder="Barcode">



<input 
id="no_part"
class="form-control mb-2"
placeholder="No Part">



<input 
id="nama_produk"
class="form-control mb-2"
placeholder="Nama Produk">



<input 
id="jenama"
class="form-control mb-2"
placeholder="Jenama">



<input 
id="jenis_motor"
class="form-control mb-2"
placeholder="Jenis Motor">



<input 
id="kategori"
class="form-control mb-2"
placeholder="Kategori">



<input 
id="unit"
class="form-control mb-2"
placeholder="Unit (PCS/SET/BOTOL)">



<input 
id="lokasi_rak"
class="form-control mb-2"
placeholder="Lokasi Rak">





<select 
id="supplier_id"
class="form-control mb-2">


<option value="">

Pilih Supplier

</option>


</select>





<input 
id="harga_modal"
type="number"
class="form-control mb-2"
placeholder="Harga Modal">





<input 
id="harga_jual"
type="number"
class="form-control mb-2"
placeholder="Harga Jual">





<input 
id="stok"
type="number"
class="form-control mb-2"
placeholder="Stok">





<input 
id="stok_minimum"
type="number"
class="form-control mb-2"
placeholder="Stok Minimum">





<select 
id="status"
class="form-control mb-2">


<option value="AKTIF">

AKTIF

</option>


<option value="TIDAK AKTIF">

TIDAK AKTIF

</option>


</select>





<textarea

id="catatan"

class="form-control mb-2"

placeholder="Catatan">

</textarea>




</div>






<div class="modal-footer">


<button 
onclick="tambahProduk()"
class="btn btn-danger">

Simpan

</button>


</div>



</div>


</div>


</div>








<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/config.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<script src="js/produk.js"></script>


</body>

</html>

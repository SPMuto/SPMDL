<link href="css/style.css" rel="stylesheet">

</head>


<body>


<div class="container-fluid">


<div class="row">



<!-- MENU -->

<div class="col-md-3 col-lg-2 bg-dark text-white min-vh-100 p-3">


<h3 class="text-danger fw-bold">
SPMDL
</h3>


<hr>



<ul class="nav flex-column">


<li>

<a class="nav-link text-white" href="dashboard.html">
🏠 Dashboard
</a>

</li>


<li>

<a class="nav-link text-white" href="produk.html">

📤 Barang Keluar

<button onclick="logout()" class="btn btn-danger w-100 mt-4">

Logout

</button>


</div>





<!-- CONTENT -->


<div class="col-md-9 col-lg-10 p-4">


<h2>
📤 Barang Keluar
</h2>



<div class="card shadow p-4">


<h5>
Tambah Barang Keluar
</h5>


<hr>



<div class="row">



<div class="col-md-4">

<label>Tarikh</label>

<input 
type="date"
id="tarikh"
class="form-control">

</div>




<div class="col-md-4">

<label>Produk</label>


<select 
id="produk_id"
class="form-control">


<option>
Pilih Produk
</option>


</select>


</div>





<div class="col-md-4">

<label>Kuantiti</label>


<input 
type="number"
id="kuantiti"
class="form-control">


</div>



</div>


<br>



<label>Catatan</label>


<input 
id="catatan"
class="form-control">



<br>



<button 
onclick="simpanBarangKeluar()"
class="btn btn-danger">

Simpan

</button>



</div>





<br>



<div class="card shadow">


<div class="card-body">


<h5>
Senarai Barang Keluar
</h5>



<table class="table table-bordered">


<thead>


<tr>

<th>Tarikh</th>
<th>Produk</th>
<th>Kuantiti</th>
<th>Catatan</th>

</tr>


</thead>



<tbody id="senaraiKeluar">


</tbody>


</table>


</div>


</div>



</div>



</div>


</div>





<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/config.js"></script>

<script src="js/barang_keluar.js"></script>


</body>

</html>

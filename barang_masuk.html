<div class="card shadow p-4">


<h5>
Tambah Barang Masuk
</h5>


<hr>



<div class="row">


<div class="col-md-4">

<label>Tarikh</label>

<input 
type="date"
id="tarikh"
class="form-control">

</div>



<div class="col-md-4">

<label>Supplier</label>

<select 
id="supplier_id"
class="form-control">

<option>
Pilih Supplier
</option>

</select>


</div>



<div class="col-md-4">

<label>Produk</label>

<select 
id="produk_id"
class="form-control">

<option>
Pilih Produk
</option>

</select>


</div>


</div>

<br>


<div class="row">


<div class="col-md-4">

<label>Kuantiti</label>

<input
type="number"
id="kuantiti"
class="form-control">

</div>



<div class="col-md-4">

<label>Harga Beli</label>

<input
type="number"
id="harga_beli"
class="form-control">

</div>



<div class="col-md-4">

<label>Catatan</label>

<input
id="catatan"
class="form-control">

</div>


</div>


<br>


<button 
onclick="simpanBarangMasuk()"
class="btn btn-danger">

Simpan

</button>


</div>





<br>

<div class="card-body">

<th>Produk</th>

<!-- Bootstrap Icons -->

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">


<!-- SPMDL Style -->

<link href="css/style.css" rel="stylesheet">


</head>


<body>


<div class="container-fluid">

<div class="row">


<!-- MENU -->

<div class="col-md-3 col-lg-2 bg-dark text-white min-vh-100 p-3">


<h3 class="text-danger fw-bold">
SPMDL
</h3>

<hr>


<ul class="nav flex-column">


<li>
<a class="nav-link text-white" href="dashboard.html">
🏠 Dashboard
</a>
</li>


<li>
<a class="nav-link text-white" href="produk.html">

<li>
<a class="nav-link text-white" href="barang_masuk.html">
📥 Barang Masuk

<li>
<a class="nav-link text-white" href="barang_keluar.html">
📤 Barang Keluar

<li>
<a class="nav-link text-white" href="supplier.html">
👥 Supplier
</a>
</li>


</ul>



<button onclick="logout()" class="btn btn-danger w-100 mt-4">

Logout

</button>


</div>





<!-- CONTENT -->


<div class="col-md-9 col-lg-10 p-4">


<h2>
📥 Barang Masuk
</h2>



<div class="card shadow p-4">


<h5>
Tambah Barang Masuk
</h5>


<hr>



<div class="row">


<div class="col-md-4">

<label>Tarikh</label>

<input 
type="date"
id="tarikh"
class="form-control">

</div>



<div class="col-md-4">

<label>Supplier</label>

<select 
id="supplier_id"
class="form-control">

<option>
Pilih Supplier
</option>

</select>


</div>



<div class="col-md-4">

<label>Produk</label>

<select 
id="produk_id"
class="form-control">

<option>
Pilih Produk
</option>

</select>


</div>


</div>

<br>


<div class="row">


<div class="col-md-4">

<label>Kuantiti</label>

<input
type="number"
id="kuantiti"
class="form-control">

</div>



<div class="col-md-4">

<label>Harga Beli</label>

<input
type="number"
id="harga_beli"
class="form-control">

</div>



<div class="col-md-4">

<label>Catatan</label>

<input
id="catatan"
class="form-control">

</div>


</div>


<br>


<button 
onclick="simpanBarangMasuk()"
class="btn btn-danger">

Simpan

</button>


</div>





<br>



<div class="card shadow">


<div class="card-body">


<h5>
Senarai Barang Masuk
</h5>


<table class="table table-bordered">


<thead>

<tr>

<th>Tarikh</th>
<th>Supplier</th>
<th>Produk</th>
<th>Kuantiti</th>
<th>Harga</th>

</tr>

</thead>


<tbody id="senaraiMasuk">


</tbody>


</table>


</div>


</div>



</div>


</div>


</div>





<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/config.js"></script>

<script src="js/barang_masuk.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>


</body>

</html>

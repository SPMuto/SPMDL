<!-- CONTENT -->
<div class="col-md-9 col-lg-10 p-4">

<h2 class="mb-4">🚚 Supplier</h2>

<div class="card shadow p-4">

<form id="supplierForm">

<div class="row">

<div class="col-md-3 mb-3">
<label>Kod Supplier</label>
<input type="text" id="kod_supplier" class="form-control">
</div>

<div class="col-md-5 mb-3">
<label>Nama Supplier</label>
<input type="text" id="nama_supplier" class="form-control" required>
</div>

<div class="col-md-4 mb-3">
<label>Nama Syarikat</label>
<input type="text" id="nama_syarikat" class="form-control">
</div>

<div class="col-md-4 mb-3">
<label>No Telefon</label>
<input type="text" id="no_telefon" class="form-control">
</div>

<div class="col-md-4 mb-3">
<label>Email</label>
<input type="email" id="email" class="form-control">
</div>

<div class="col-md-4 mb-3">
<label>Alamat</label>
<textarea id="alamat" class="form-control"></textarea>
</div>

</div>

<button type="button" onclick="simpanSupplier()" class="btn btn-primary">
<i class="bi bi-save"></i>
Simpan Supplier
</button>

</form>

</div>

<div class="card shadow mt-4">

<div class="card-header">
<h5 class="mb-0">Senarai Supplier</h5>
</div>

<div class="card-body">

<table class="table table-bordered table-hover">

<thead class="table-dark">

<tr>
<th>Kod</th>
<th>Nama Supplier</th>
<th>Syarikat</th>
<th>Telefon</th>
<th>Email</th>
<th>Tindakan</th>
</tr>

</thead>

<tbody id="senaraiSupplier">

</tbody>

</table>

</div>

</div>

</div>

</div>

SPMDR

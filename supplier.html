<!DOCTYPE html>
<html lang="ms">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SPMDR - Supplier</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

<link href="css/style.css" rel="stylesheet">

</head>

<body>

<div class="container-fluid">
<div class="row">

<!-- SIDEBAR -->

<div class="col-md-3 col-lg-2 sidebar">

    <div class="logo mb-4">
        <i class="bi bi-box-seam-fill"></i>
        <span>SPMDR</span>
    </div>

    <p class="text-secondary small mb-4">
        Sistem Pengurusan Sparepart
    </p>

    <a href="dashboard.html">
        <i class="bi bi-speedometer2"></i>
        Dashboard
    </a>

    <a href="produk.html">
        <i class="bi bi-box"></i>
        Produk
    </a>

    <a href="supplier.html" class="active">
        <i class="bi bi-truck"></i>
        Supplier
    </a>

    <a href="pelanggan.html">
        <i class="bi bi-people"></i>
        Pelanggan
    </a>

    <a href="barang_masuk.html">
        <i class="bi bi-box-arrow-in-down"></i>
        Barang Masuk
    </a>

    <a href="barang_keluar.html">
        <i class="bi bi-box-arrow-up"></i>
        Barang Keluar
    </a>

    <a href="jualan.html">
        <i class="bi bi-cart3"></i>
        Jualan
    </a>

    <a href="laporan.html">
        <i class="bi bi-bar-chart"></i>
        Laporan
    </a>

    <a href="tetapan.html">
        <i class="bi bi-gear"></i>
        Tetapan
    </a>

    <hr class="text-secondary">

    <button onclick="logout()" class="btn btn-danger w-100">
        <i class="bi bi-box-arrow-right"></i>
        Logout
    </button>

</div>

<!-- CONTENT -->

<div class="col-md-9 col-lg-10 p-4">

    <h2>🚚 Supplier</h2>

    <div class="card shadow p-4">

        <div class="row mb-3">

            <div class="col-md-4">
                <label>Nama Supplier</label>
                <input type="text" id="nama" class="form-control">
            </div>

            <div class="col-md-4">
                <label>No Telefon</label>
                <input type="text" id="telefon" class="form-control">
            </div>

            <div class="col-md-4">
                <label>Email</label>
                <input type="email" id="email" class="form-control">
            </div>

        </div>

        <div class="mb-3">

            <label>Alamat</label>

            <textarea id="alamat" class="form-control" rows="3"></textarea>

        </div>

        <button class="btn btn-primary" onclick="simpanSupplier()">
            <i class="bi bi-save"></i>
            Simpan Supplier
        </button>

        <hr>

        <table class="table table-bordered table-hover">

            <thead class="table-dark">

                <tr>
                    <th>Nama</th>
                    <th>Telefon</th>
                    <th>Email</th>
                    <th>Alamat</th>
                    <th>Tindakan</th>
                </tr>

            </thead>

            <tbody id="senaraiSupplier">

            </tbody>

        </table>

    </div>

</div>

</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/supplier.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
